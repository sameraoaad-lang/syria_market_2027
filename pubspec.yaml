name: souq_syria
description: "سوق سوريا الشامل 2026 - تطبيق إعلانات مبوبة متكامل"
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Supabase
  supabase_flutter: ^2.5.6
  # UI / Fonts
  google_fonts: ^6.2.1
  carousel_slider: ^4.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  # Utils
  # === تم تعديل قيد الإصدار من "0.20.2" (رقم ثابت) إلى "^0.20.3" لأن
  # flutter_localizations يطلب intl ^0.20.3 على الأقل، والرقم الثابت
  # القديم كان يمنع أي ترقية ويسبب فشل "version solving failed". ===
  intl: ^0.20.3
  equatable: ^2.0.5
  # === تمت إضافة هذه الحزم الخمس لأنها مستخدمة فعلياً داخل ملف الكود
  # (souq_syria_complete.dart) عبر import مباشر، لكنها كانت غائبة تماماً
  # عن pubspec.yaml. بدونها ستحصل على خطأ "Target of URI doesn't exist"
  # لكل استيراد منها عند تشغيل flutter pub get / flutter run. ===
  cross_file: ^0.3.4+2
  flutter_image_compress: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.3
  uuid: ^4.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
  # في حال إضافة ملفات خط عربي محلية (مثال: Cairo) ضعها هنا مستقبلاً:
  # fonts:
  #   - family: Cairo
  #     fonts:
  #       - asset: assets/fonts/Cairo-Regular.ttf
  #       - asset: assets/fonts/Cairo-Bold.ttf
  #         weight: 700
